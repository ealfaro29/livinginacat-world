<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Cargá las 16 SQN05M4 antes de cerrar</title><desc>El tornillo queda hacia la boca de la ranura; la tuerca se desliza desde el extremo.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#cf5b27"/></marker></defs><rect width="1200" height="760" fill="#faf8f2"/><text x="40" y="50.0" font-family="DejaVu Sans,Arial" font-size="32" fill="#173d39" font-weight="700" text-anchor="start">Cargá las 16 SQN05M4 antes de cerrar</text><text x="40" y="89.0" font-family="DejaVu Sans,Arial" font-size="21" fill="#173d39" font-weight="400" text-anchor="start">El tornillo queda hacia la boca de la ranura; la tuerca se desliza desde el extremo.</text><line x1="40" y1="110" x2="1160" y2="110" stroke="#d0ddd6" stroke-width="1"/><text x="65" y="157.0" font-family="DejaVu Sans,Arial" font-size="23" fill="#173d39" font-weight="700" text-anchor="start">CADA COSTADO · 355 mm</text><rect x="275" y="190" width="650" height="65" rx="0" fill="#d6dfdf" stroke="#173d39" stroke-width="2"/><rect x="275" y="210" width="650" height="25" rx="0" fill="#889da3" stroke="#173d39" stroke-width="2"/><line x1="155" y1="222" x2="260" y2="222" stroke="#cf5b27" stroke-width="4" marker-end="url(#a)"/><rect x="320.5" y="207.5" width="29" height="29" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="335" cy="222" r="5.51" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><rect x="490.5" y="207.5" width="29" height="29" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="505" cy="222" r="5.51" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><rect x="660.5" y="207.5" width="29" height="29" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="675" cy="222" r="5.51" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><rect x="830.5" y="207.5" width="29" height="29" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="845" cy="222" r="5.51" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><text x="960" y="216.0" font-family="DejaVu Sans,Arial" font-size="21" fill="#173d39" font-weight="700" text-anchor="start">2 costados × 4 = 8</text><text x="65" y="293.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#087f79" font-weight="400" text-anchor="start">Ranura interior inferior</text><text x="65" y="317.0" font-family="DejaVu Sans,Arial" font-size="23" fill="#173d39" font-weight="700" text-anchor="start">CADA EXTREMO GRUESO · 190 mm</text><rect x="275" y="350" width="650" height="65" rx="0" fill="#d6dfdf" stroke="#173d39" stroke-width="2"/><rect x="275" y="370" width="650" height="25" rx="0" fill="#889da3" stroke="#173d39" stroke-width="2"/><line x1="155" y1="382" x2="260" y2="382" stroke="#cf5b27" stroke-width="4" marker-end="url(#a)"/><rect x="365.5" y="367.5" width="29" height="29" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="380" cy="382" r="5.51" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><rect x="785.5" y="367.5" width="29" height="29" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="800" cy="382" r="5.51" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><text x="960" y="376.0" font-family="DejaVu Sans,Arial" font-size="21" fill="#173d39" font-weight="700" text-anchor="start">2 perfiles × 2 = 4</text><text x="65" y="453.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#087f79" font-weight="400" text-anchor="start">Ranura interior inferior</text><text x="65" y="477.0" font-family="DejaVu Sans,Arial" font-size="23" fill="#173d39" font-weight="700" text-anchor="start">CADA TRAVESAÑO DELGADO · 190 mm</text><rect x="275" y="510" width="650" height="65" rx="0" fill="#d6dfdf" stroke="#173d39" stroke-width="2"/><rect x="275" y="530" width="650" height="25" rx="0" fill="#889da3" stroke="#173d39" stroke-width="2"/><line x1="155" y1="542" x2="260" y2="542" stroke="#cf5b27" stroke-width="4" marker-end="url(#a)"/><rect x="365.5" y="527.5" width="29" height="29" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="380" cy="542" r="5.51" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><rect x="785.5" y="527.5" width="29" height="29" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="800" cy="542" r="5.51" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><text x="960" y="536.0" font-family="DejaVu Sans,Arial" font-size="21" fill="#173d39" font-weight="700" text-anchor="start">2 perfiles × 2 = 4</text><text x="65" y="613.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#087f79" font-weight="400" text-anchor="start">Ranura superior</text><text x="322" y="295.0" font-family="DejaVu Sans,Arial" font-size="18" fill="#173d39" font-weight="400" text-anchor="start">esquina</text><text x="474" y="295.0" font-family="DejaVu Sans,Arial" font-size="18" fill="#173d39" font-weight="400" text-anchor="start">cama</text><text x="646" y="295.0" font-family="DejaVu Sans,Arial" font-size="18" fill="#173d39" font-weight="400" text-anchor="start">cama</text><text x="810" y="295.0" font-family="DejaVu Sans,Arial" font-size="18" fill="#173d39" font-weight="400" text-anchor="start">esquina</text><text x="65" y="649.0" font-family="DejaVu Sans,Arial" font-size="21" fill="#173d39" font-weight="400" text-anchor="start">En los gruesos: 40 mm vertical. En los travesaños: la ranura cargada mira arriba.</text><rect x="40" y="684" width="1120" height="48" rx="6" fill="#e4f1ec" stroke="none" stroke-width="2"/><text x="58" y="715.0" font-family="DejaVu Sans,Arial" font-size="23" fill="#173d39" font-weight="700" text-anchor="start">Comprobación: 8 + 4 + 4 = 16. Reservá las tuercas de cama entre las de esquina.</text><text x="40" y="752.0" font-family="DejaVu Sans,Arial" font-size="14" fill="#526b73" font-weight="400" text-anchor="start">Herrajes esquemáticos · no usar como plantilla de perforación · FT412 / edición 3</text></svg>