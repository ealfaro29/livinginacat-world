<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1000" viewBox="0 0 1200 1000" role="img"><title>Dejá holgura para los cables</title><desc>El soporte largo del tubo va junto al soporte electrónico, en el fondo.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#ce602e"/></marker></defs><rect width="1200" height="1000" fill="#faf8f2"/><text x="50" y="50.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#078578" text-anchor="start">FT412  /  MONTAJE VISUAL</text><text x="50" y="100.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="37" font-weight="700" fill="#173d39" text-anchor="start">Dejá holgura para los cables</text><text x="50" y="140.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#173d39" text-anchor="start">El soporte largo del tubo va junto al soporte electrónico, en el fondo.</text><line x1="50" y1="164" x2="1150" y2="164" stroke="#cedbd5" stroke-width="1"/><image x="70" y="260" width="450" height="450" xlink:href="data:image/png;base64,"/><text x="75" y="770.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#078578" text-anchor="start">2 M5×12 avellanados</text><text x="75" y="803.75" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#078578" text-anchor="start">+ 2 RN05BM5</text><rect x="690" y="345" width="380" height="310" rx="0" fill="none" stroke="#b5c4c7" stroke-width="2"/><rect x="730" y="485" width="300" height="20" rx="0" fill="#b5c4c7" stroke="#173d39" stroke-width="2"/><rect x="845" y="465" width="70" height="60" rx="0" fill="#078578" stroke="#173d39" stroke-width="2"/><path d="M1030 350 C1150 190 650 165 880 465" fill="none" stroke="#ce602e" stroke-width="13"/><line x1="875" y1="570" x2="745" y2="570" stroke="#ce602e" stroke-width="4" marker-end="url(#arrow)"/><line x1="890" y1="570" x2="1020" y2="570" stroke="#ce602e" stroke-width="4" marker-end="url(#arrow)"/><text x="690" y="725.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#173d39" text-anchor="start">Recorré el espacio a mano.</text><text x="690" y="771.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173d39" text-anchor="start">El tubo no tira del cabezal</text><text x="690" y="803.4" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173d39" text-anchor="start">ni entra en las correas.</text><rect x="50" y="884" width="1100" height="65" rx="10" fill="#e4f1ec" stroke="none" stroke-width="2"/><text x="75" y="923.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#173d39" text-anchor="start">Alojamiento del tubo hacia arriba. Conservá la curva y el retorno del actuador.</text><text x="50" y="978.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526b73" text-anchor="start">Piezas impresas: geometría STL real. Herrajes y flechas: esquema de montaje, sin escala.</text></svg>