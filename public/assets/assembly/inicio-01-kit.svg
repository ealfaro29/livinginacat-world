<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Reconocé el kit de una escuadra</title><desc>Cada GS20-05W aporta una escuadra, dos M4×8 y dos SQN05M4.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#cf5b27"/></marker></defs><rect width="1200" height="760" fill="#faf8f2"/><text x="40" y="50.0" font-family="DejaVu Sans,Arial" font-size="32" fill="#173d39" font-weight="700" text-anchor="start">Reconocé el kit de una escuadra</text><text x="40" y="89.0" font-family="DejaVu Sans,Arial" font-size="21" fill="#173d39" font-weight="400" text-anchor="start">Cada GS20-05W aporta una escuadra, dos M4×8 y dos SQN05M4.</text><line x1="40" y1="110" x2="1160" y2="110" stroke="#d0ddd6" stroke-width="1"/><text x="65" y="165.0" font-family="DejaVu Sans,Arial" font-size="25" fill="#087f79" font-weight="700" text-anchor="start">1 ESCUADRA</text><polygon points="80,355 80,240 230,180 230,295" fill="#afbdc0" stroke="#173d39" stroke-width="2"/><polygon points="80,355 230,295 350,350 200,410" fill="#d6dfdf" stroke="#173d39" stroke-width="2"/><polygon points="90,340 90,259 203,390" fill="#93a5aa" stroke="#173d39" stroke-width="2"/><polygon points="215,285 215,205 330,345" fill="#93a5aa" stroke="#173d39" stroke-width="2"/><circle cx="155" cy="270" r="17" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><circle cx="242" cy="350" r="17" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><text x="65" y="457.0" font-family="DejaVu Sans,Arial" font-size="24" fill="#173d39" font-weight="700" text-anchor="start">Dos alas a 90°</text><text x="65" y="493.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">Un agujero por ala.</text><text x="65" y="521.6" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">Une dos perfiles.</text><text x="455" y="165.0" font-family="DejaVu Sans,Arial" font-size="25" fill="#087f79" font-weight="700" text-anchor="start">2 TORNILLOS</text><rect x="499" y="270" width="12" height="95" rx="0" fill="#526b73" stroke="#173d39" stroke-width="2"/><rect x="486" y="258" width="38" height="12" rx="3" fill="#526b73" stroke="#173d39" stroke-width="2"/><line x1="500" y1="278" x2="510" y2="274" stroke="#faf8f2" stroke-width="1"/><line x1="500" y1="287" x2="510" y2="283" stroke="#faf8f2" stroke-width="1"/><line x1="500" y1="296" x2="510" y2="292" stroke="#faf8f2" stroke-width="1"/><line x1="500" y1="305" x2="510" y2="301" stroke="#faf8f2" stroke-width="1"/><line x1="500" y1="314" x2="510" y2="310" stroke="#faf8f2" stroke-width="1"/><line x1="500" y1="323" x2="510" y2="319" stroke="#faf8f2" stroke-width="1"/><line x1="500" y1="332" x2="510" y2="328" stroke="#faf8f2" stroke-width="1"/><line x1="500" y1="341" x2="510" y2="337" stroke="#faf8f2" stroke-width="1"/><line x1="500" y1="350" x2="510" y2="346" stroke="#faf8f2" stroke-width="1"/><line x1="500" y1="359" x2="510" y2="355" stroke="#faf8f2" stroke-width="1"/><rect x="619" y="270" width="12" height="95" rx="0" fill="#526b73" stroke="#173d39" stroke-width="2"/><rect x="606" y="258" width="38" height="12" rx="3" fill="#526b73" stroke="#173d39" stroke-width="2"/><line x1="620" y1="278" x2="630" y2="274" stroke="#faf8f2" stroke-width="1"/><line x1="620" y1="287" x2="630" y2="283" stroke="#faf8f2" stroke-width="1"/><line x1="620" y1="296" x2="630" y2="292" stroke="#faf8f2" stroke-width="1"/><line x1="620" y1="305" x2="630" y2="301" stroke="#faf8f2" stroke-width="1"/><line x1="620" y1="314" x2="630" y2="310" stroke="#faf8f2" stroke-width="1"/><line x1="620" y1="323" x2="630" y2="319" stroke="#faf8f2" stroke-width="1"/><line x1="620" y1="332" x2="630" y2="328" stroke="#faf8f2" stroke-width="1"/><line x1="620" y1="341" x2="630" y2="337" stroke="#faf8f2" stroke-width="1"/><line x1="620" y1="350" x2="630" y2="346" stroke="#faf8f2" stroke-width="1"/><line x1="620" y1="359" x2="630" y2="355" stroke="#faf8f2" stroke-width="1"/><text x="455" y="457.0" font-family="DejaVu Sans,Arial" font-size="24" fill="#173d39" font-weight="700" text-anchor="start">M4×8 del kit</text><text x="455" y="493.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">Rosca de 4 mm.</text><text x="455" y="521.6" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">Largo bajo cabeza: 8 mm.</text><text x="830" y="165.0" font-family="DejaVu Sans,Arial" font-size="25" fill="#087f79" font-weight="700" text-anchor="start">2 TUERCAS</text><rect x="850.0" y="262.0" width="80" height="80" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="890" cy="302" r="15.2" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><rect x="990.0" y="262.0" width="80" height="80" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="1030" cy="302" r="15.2" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><text x="830" y="457.0" font-family="DejaVu Sans,Arial" font-size="24" fill="#173d39" font-weight="700" text-anchor="start">SQN05M4</text><text x="830" y="493.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">Cuadradas: 9×9×3 mm.</text><text x="830" y="521.6" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">Entran por el extremo.</text><rect x="65" y="583" width="1070" height="62" rx="8" fill="#e4f1ec" stroke="none" stroke-width="2"/><text x="85" y="622.0" font-family="DejaVu Sans,Arial" font-size="23" fill="#173d39" font-weight="700" text-anchor="start">8 kits en total: 4 para las esquinas + 4 para los travesaños de cama.</text><rect x="40" y="684" width="1120" height="48" rx="6" fill="#e4f1ec" stroke="none" stroke-width="2"/><text x="58" y="715.0" font-family="DejaVu Sans,Arial" font-size="23" fill="#173d39" font-weight="700" text-anchor="start">No confundás estas tuercas con las M4 pequeñas de las piezas impresas.</text><text x="40" y="752.0" font-family="DejaVu Sans,Arial" font-size="14" fill="#526b73" font-weight="400" text-anchor="start">Herrajes esquemáticos · no usar como plantilla de perforación · FT412 / edición 3</text></svg>