<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>living in a cat world — share artwork</title>
    <style>
      @font-face {
        font-family: Space;
        src: url("/assets/fonts/SpaceGrotesk-Variable.ttf");
        font-weight: 300 700;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        background: #101011;
        color: #f0e9df;
        font-family: Space, Arial, sans-serif;
      }
      .share {
        width: 1200px;
        height: 630px;
        display: grid;
        grid-template-columns: 440px minmax(0, 1fr);
        padding: 40px 35px;
        gap: 20px;
      }
      .copy {
        padding: 0 0 0 12px;
        position: relative;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 14px;
        line-height: 1.05;
        letter-spacing: -0.4px;
      }
      .brand img {
        width: 42px;
        height: 42px;
        object-fit: contain;
      }
      .kicker {
        font: 8px/1.5 monospace;
        color: #aca6a0;
        letter-spacing: 1.2px;
        margin: 58px 0 25px;
      }
      .copy h1 {
        font:
          600 75px/0.95 Space,
          Arial,
          sans-serif;
        letter-spacing: -4px;
        margin: 0 0 25px;
      }
      .copy h1 em {
        font:
          italic 86px/0.95 Georgia,
          serif;
        letter-spacing: -4px;
      }
      .dot {
        color: #f04b41;
      }
      .copy p:not(.kicker) {
        font-size: 13px;
        line-height: 1.9;
        color: #aca6a0;
      }
      .address {
        position: absolute;
        left: 12px;
        bottom: 7px;
        font: 9px/1.5 monospace;
        color: #f0e9df;
      }
      .machine {
        margin: 0;
        align-self: center;
        transform: rotate(-3deg);
        background: #f0e9df;
        color: #191817;
        box-shadow: 0 16px 35px #0008;
        position: relative;
        padding-top: 25px;
      }
      .machine:before {
        content: "";
        position: absolute;
        top: -13px;
        left: 35px;
        width: 70px;
        height: 25px;
        background: #d7c6aa90;
        transform: rotate(-15deg);
      }
      .machine > div {
        position: absolute;
        top: 10px;
        left: 18px;
        right: 18px;
        display: flex;
        justify-content: space-between;
        font: 7px/1.5 monospace;
        letter-spacing: 0.5px;
      }
      .machine img {
        display: block;
        width: 100%;
        height: auto;
        mix-blend-mode: multiply;
      }
      .machine figcaption {
        padding: 10px 17px;
        border-top: 1px solid #19181740;
        font: 7px/1.5 monospace;
        letter-spacing: 0.4px;
      }
    </style>
  </head>
  <body>
    <main class="share">
      <div class="copy">
        <div class="brand">
          <img src="/assets/brand/robot-cat-180.png" alt="" /><span
            >living in a<br />cat world</span
          >
        </div>
        <p class="kicker">A PERSONAL BUILD JOURNAL</p>
        <h1>
          living in a<br /><em>cat world<span class="dot">.</span></em>
        </h1>
        <p>
          Building a robot that sees an iPhone.<br />And actually touches it.
        </p>
        <div class="address">PLANS. RECEIPTS. UNFINISHED BITS. ↗</div>
      </div>
      <figure class="machine">
        <div><span>ON THE WORKBENCH / 001</span><span>REV. 0.1</span></div>
        <img
          src="/assets/prototype-rough-v1.png"
          alt="Raw sketch of the iPhone robot"
        />
        <figcaption>CONCEPT SKETCH / PHYSICAL TESTS AHEAD</figcaption>
      </figure>
    </main>
  </body>
</html>
