<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Primero las seis tuercas de la abrazadera</title><desc>Después: correa A en el canal inferior; después: fijar la abrazadera al carro.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#cf5b27"/></marker></defs><rect width="1200" height="760" fill="#faf8f2"/><text x="40" y="50.0" font-family="DejaVu Sans,Arial" font-size="32" fill="#173d39" font-weight="700" text-anchor="start">Primero las seis tuercas de la abrazadera</text><text x="40" y="89.0" font-family="DejaVu Sans,Arial" font-size="21" fill="#173d39" font-weight="400" text-anchor="start">Después: correa A en el canal inferior; después: fijar la abrazadera al carro.</text><line x1="40" y1="110" x2="1160" y2="110" stroke="#d0ddd6" stroke-width="1"/><text x="70" y="165.0" font-family="DejaVu Sans,Arial" font-size="24" fill="#087f79" font-weight="700" text-anchor="start">1 · CARGAR TUERCAS</text><rect x="110" y="350" width="420" height="90" rx="0" fill="#b8d7d1" stroke="#173d39" stroke-width="2"/><rect x="110" y="240" width="55" height="110" rx="0" fill="#b8d7d1" stroke="#173d39" stroke-width="2"/><rect x="209.0" y="284.0" width="32" height="32" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="225" cy="300" r="6.08" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><line x1="225" y1="322" x2="225" y2="347" stroke="#cf5b27" stroke-width="3" marker-end="url(#a)"/><rect x="299.0" y="284.0" width="32" height="32" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="315" cy="300" r="6.08" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><line x1="315" y1="322" x2="315" y2="347" stroke="#cf5b27" stroke-width="3" marker-end="url(#a)"/><rect x="389.0" y="284.0" width="32" height="32" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="405" cy="300" r="6.08" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><line x1="405" y1="322" x2="405" y2="347" stroke="#cf5b27" stroke-width="3" marker-end="url(#a)"/><rect x="479.0" y="284.0" width="32" height="32" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="495" cy="300" r="6.08" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><line x1="495" y1="322" x2="495" y2="347" stroke="#cf5b27" stroke-width="3" marker-end="url(#a)"/><rect x="50.5" y="250.5" width="29" height="29" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="65" cy="265" r="5.51" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><line x1="85" y1="265" x2="108" y2="265" stroke="#cf5b27" stroke-width="3" marker-end="url(#a)"/><rect x="50.5" y="305.5" width="29" height="29" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="65" cy="320" r="5.51" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><line x1="85" y1="320" x2="108" y2="320" stroke="#cf5b27" stroke-width="3" marker-end="url(#a)"/><text x="180" y="485.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">4 reciben la base de la cuna.</text><text x="70" y="530.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">2 reciben la pared de la cuna.</text><text x="650" y="165.0" font-family="DejaVu Sans,Arial" font-size="24" fill="#087f79" font-weight="700" text-anchor="start">2 · CORREA INFERIOR</text><rect x="680" y="230" width="420" height="105" rx="0" fill="#b8d7d1" stroke="#173d39" stroke-width="2"/><circle cx="780" cy="282" r="20" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><path d="M1110 265 H780 A17 17 0 0 0 780 299 H1020" fill="none" stroke="#cf5b27" stroke-width="10"/><text x="650" y="380.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">Rodeá el poste y doblá la cola.</text><text x="650" y="408.6" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">Los dientes se traban entre sí.</text><text x="650" y="485.0" font-family="DejaVu Sans,Arial" font-size="24" fill="#087f79" font-weight="700" text-anchor="start">3 · FIJAR AL CARRO</text><text x="650" y="535.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">4 M3×8 van al metal del carro.</text><text x="650" y="563.6" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">No gastan las 6 tuercas de la cuna.</text><text x="70" y="625.0" font-family="DejaVu Sans,Arial" font-size="21" fill="#526b73" font-weight="400" text-anchor="start">Esquema funcional de fijaciones: identificá los seis bolsillos en la pieza real.</text><rect x="40" y="684" width="1120" height="48" rx="6" fill="#e4f1ec" stroke="none" stroke-width="2"/><text x="58" y="715.0" font-family="DejaVu Sans,Arial" font-size="23" fill="#173d39" font-weight="700" text-anchor="start">No cierres el acceso inferior antes de pasar la correa A.</text><text x="40" y="752.0" font-family="DejaVu Sans,Arial" font-size="14" fill="#526b73" font-weight="400" text-anchor="start">Herrajes esquemáticos · no usar como plantilla de perforación · FT412 / edición 3</text></svg>