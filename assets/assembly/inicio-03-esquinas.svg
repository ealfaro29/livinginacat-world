<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>Cómo se sujeta una esquina</title><desc>Una escuadra por esquina interior, dos tornillos y dos tuercas ya dentro de los perfiles.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#cf5b27"/></marker></defs><rect width="1200" height="760" fill="#faf8f2"/><text x="40" y="50.0" font-family="DejaVu Sans,Arial" font-size="32" fill="#173d39" font-weight="700" text-anchor="start">Cómo se sujeta una esquina</text><text x="40" y="89.0" font-family="DejaVu Sans,Arial" font-size="21" fill="#173d39" font-weight="400" text-anchor="start">Una escuadra por esquina interior, dos tornillos y dos tuercas ya dentro de los perfiles.</text><line x1="40" y1="110" x2="1160" y2="110" stroke="#d0ddd6" stroke-width="1"/><text x="60" y="160.0" font-family="DejaVu Sans,Arial" font-size="23" fill="#087f79" font-weight="700" text-anchor="start">VISTA DESDE ARRIBA</text><rect x="75" y="205" width="90" height="370" rx="0" fill="#d6dfdf" stroke="#173d39" stroke-width="2"/><rect x="165" y="485" width="370" height="90" rx="0" fill="#d6dfdf" stroke="#173d39" stroke-width="2"/><line x1="121" y1="214" x2="121" y2="567" stroke="#526b73" stroke-width="8"/><line x1="172" y1="529" x2="522" y2="529" stroke="#526b73" stroke-width="8"/><polygon points="168,481 168,315 190,315 190,459 345,459 345,481" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><polygon points="190,325 190,459 333,459" fill="#eba680" stroke="#173d39" stroke-width="2"/><rect x="105.0" y="353.0" width="32" height="32" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="121" cy="369" r="6.08" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><rect x="269.0" y="513.0" width="32" height="32" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><circle cx="285" cy="529" r="6.08" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><line x1="121" y1="369" x2="215" y2="369" stroke="#173d39" stroke-width="9"/><line x1="214" y1="354" x2="214" y2="384" stroke="#173d39" stroke-width="9"/><line x1="285" y1="529" x2="285" y2="431" stroke="#173d39" stroke-width="9"/><line x1="270" y1="431" x2="300" y2="431" stroke="#173d39" stroke-width="9"/><text x="220" y="237.0" font-family="DejaVu Sans,Arial" font-size="23" fill="#173d39" font-weight="700" text-anchor="start">Interior del marco</text><line x1="330" y1="251" x2="245" y2="339" stroke="#cf5b27" stroke-width="3" marker-end="url(#a)"/><text x="70" y="625.0" font-family="DejaVu Sans,Arial" font-size="23" fill="#173d39" font-weight="700" text-anchor="start">Un tornillo hacia cada perfil.</text><text x="650" y="160.0" font-family="DejaVu Sans,Arial" font-size="23" fill="#087f79" font-weight="700" text-anchor="start">CORTE DE LA CARA INTERIOR</text><rect x="650" y="220" width="150" height="350" rx="0" fill="#d6dfdf" stroke="#173d39" stroke-width="2"/><line x1="650" y1="395" x2="800" y2="395" stroke="#526b73" stroke-width="3"/><rect x="736" y="273" width="38" height="70" rx="0" fill="#faf8f2" stroke="#faf8f2" stroke-width="2"/><rect x="774" y="294" width="29" height="28" rx="0" fill="#faf8f2" stroke="#faf8f2" stroke-width="2"/><rect x="736" y="448" width="38" height="70" rx="0" fill="#faf8f2" stroke="#faf8f2" stroke-width="2"/><rect x="774" y="469" width="29" height="28" rx="0" fill="#faf8f2" stroke="#faf8f2" stroke-width="2"/><rect x="751" y="461" width="14" height="44" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><rect x="813" y="410" width="22" height="150" rx="0" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><line x1="758" y1="483" x2="887" y2="483" stroke="#173d39" stroke-width="10"/><line x1="887" y1="461" x2="887" y2="505" stroke="#173d39" stroke-width="14"/><text x="850" y="268.0" font-family="DejaVu Sans,Arial" font-size="24" fill="#173d39" font-weight="700" text-anchor="start">Arriba libre</text><text x="850" y="304.0" font-family="DejaVu Sans,Arial" font-size="21" fill="#173d39" font-weight="400" text-anchor="start">Rieles y poleas</text><text x="850" y="403.0" font-family="DejaVu Sans,Arial" font-size="24" fill="#cf5b27" font-weight="700" text-anchor="start">Escuadra abajo</text><text x="850" y="546.0" font-family="DejaVu Sans,Arial" font-size="21" fill="#173d39" font-weight="400" text-anchor="start">M4×8 → ala → tuerca</text><text x="650" y="625.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">La tuerca queda detrás de los labios.</text><rect x="40" y="684" width="1120" height="48" rx="6" fill="#e4f1ec" stroke="none" stroke-width="2"/><text x="58" y="715.0" font-family="DejaVu Sans,Arial" font-size="23" fill="#173d39" font-weight="700" text-anchor="start">Usá 8 tuercas para las esquinas. Dejá las otras 8 reservadas para la cama.</text><text x="40" y="752.0" font-family="DejaVu Sans,Arial" font-size="14" fill="#526b73" font-weight="400" text-anchor="start">Herrajes esquemáticos · no usar como plantilla de perforación · FT412 / edición 3</text></svg>