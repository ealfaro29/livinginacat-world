<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1000" viewBox="0 0 1200 1000" role="img"><title>03 / Montá las cuatro patas</title><desc>La cara plana toca el aluminio; el alojamiento profundo mira hacia la mesa.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#ce602e"/></marker></defs><rect width="1200" height="1000" fill="#faf8f2"/><text x="50" y="50.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#078578" text-anchor="start">FT412  /  MONTAJE VISUAL</text><text x="50" y="100.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="37" font-weight="700" fill="#173d39" text-anchor="start">03 / Montá las cuatro patas</text><text x="50" y="140.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#173d39" text-anchor="start">La cara plana toca el aluminio; el alojamiento profundo mira hacia la mesa.</text><line x1="50" y1="164" x2="1150" y2="164" stroke="#cedbd5" stroke-width="1"/><circle cx="75" cy="207" r="18" fill="#078578" stroke="#078578" stroke-width="3"/><text x="75" y="214.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#faf8f2" text-anchor="middle">A</text><text x="105" y="215.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#173d39" text-anchor="start">Reconocé la pieza</text><circle cx="650" cy="207" r="18" fill="#078578" stroke="#078578" stroke-width="3"/><text x="650" y="214.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700" fill="#faf8f2" text-anchor="middle">B</text><text x="680" y="215.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#173d39" text-anchor="start">Orden de montaje, en corte</text><image x="70" y="270" width="430" height="380" xlink:href="data:image/png;base64,"/><text x="90" y="735.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#078578" text-anchor="start">4 patas + 4 M5×16</text><text x="90" y="780.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173d39" text-anchor="start">4 tuercas RN05BM5</text><rect x="695" y="285" width="375" height="120" rx="0" fill="#dce3e2" stroke="#173d39" stroke-width="2"/><line x1="701" y1="339.0" x2="1064" y2="339.0" stroke="#526b73" stroke-width="3"/><line x1="701" y1="357.0" x2="1064" y2="357.0" stroke="#526b73" stroke-width="2"/><rect x="840" y="365" width="90" height="35" rx="0" fill="#ce602e" stroke="#173d39" stroke-width="2"/><text x="680" y="262.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#173d39" text-anchor="start">Ranura inferior del perfil</text><rect x="775" y="460" width="220" height="230" rx="0" fill="#078578" stroke="#173d39" stroke-width="2"/><rect x="810" y="565" width="150" height="126" rx="0" fill="#faf8f2" stroke="#faf8f2" stroke-width="2"/><rect x="875" y="459" width="20" height="111" rx="0" fill="#faf8f2" stroke="#faf8f2" stroke-width="2"/><g transform="rotate(180 885 765)"><rect x="878" y="765" width="14" height="75" rx="0" fill="#526b73" stroke="#526b73" stroke-width="2"/><rect x="864" y="749" width="42" height="20" rx="6" fill="#526b73" stroke="#526b73" stroke-width="2"/><line x1="879" y1="775" x2="891" y2="771" stroke="#faf8f2" stroke-width="1"/><line x1="879" y1="784" x2="891" y2="780" stroke="#faf8f2" stroke-width="1"/><line x1="879" y1="793" x2="891" y2="789" stroke="#faf8f2" stroke-width="1"/><line x1="879" y1="802" x2="891" y2="798" stroke="#faf8f2" stroke-width="1"/><line x1="879" y1="811" x2="891" y2="807" stroke="#faf8f2" stroke-width="1"/><line x1="879" y1="820" x2="891" y2="816" stroke="#faf8f2" stroke-width="1"/><line x1="879" y1="829" x2="891" y2="825" stroke="#faf8f2" stroke-width="1"/><line x1="879" y1="838" x2="891" y2="834" stroke="#faf8f2" stroke-width="1"/><line x1="877" y1="75