<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1000" viewBox="0 0 1200 1000" role="img"><title>Separá los cuatro ejes móviles</title><desc>Solo esos cuatro requieren revisar y ajustar la punta roscada. No el hombro liso.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#ce602e"/></marker></defs><rect width="1200" height="1000" fill="#faf8f2"/><text x="50" y="50.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" fill="#078578" text-anchor="start">FT412  /  MONTAJE VISUAL</text><text x="50" y="100.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="37" font-weight="700" fill="#173d39" text-anchor="start">Separá los cuatro ejes móviles</text><text x="50" y="140.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#173d39" text-anchor="start">Solo esos cuatro requieren revisar y ajustar la punta roscada. No el hombro liso.</text><line x1="50" y1="164" x2="1150" y2="164" stroke="#cedbd5" stroke-width="1"/><text x="70" y="232.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#078578" text-anchor="start">6 EJES EN BLOQUES FIJOS</text><rect x="100" y="290" width="72" height="70" rx="0" fill="#526b73" stroke="#173d39" stroke-width="2"/><rect x="172" y="310" width="380" height="30" rx="0" fill="#b5c4c7" stroke="#173d39" stroke-width="2"/><rect x="552" y="315" width="150" height="20" rx="0" fill="#ce602e" stroke="#173d39" stroke-width="2"/><text x="810" y="335.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="700" fill="#173d39" text-anchor="start">Rosca: 8 mm</text><text x="70" y="442.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#078578" text-anchor="start">4 EJES EN UNIONES MÓVILES</text><rect x="100" y="510" width="72" height="70" rx="0" fill="#526b73" stroke="#173d39" stroke-width="2"/><rect x="172" y="530" width="380" height="30" rx="0" fill="#b5c4c7" stroke="#173d39" stroke-width="2"/><rect x="552" y="535" width="140" height="20" rx="0" fill="#ce602e" stroke="#173d39" stroke-width="2"/><line x1="692" y1="509" x2="692" y2="581" stroke="#ce602e" stroke-width="4" stroke-dasharray="6 5"/><text x="765" y="551.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="26" font-weight="700" fill="#173d39" text-anchor="start">Rosca: 7,2–7,5 mm</text><line x1="552" y1="590" x2="692" y2="590" stroke="#ce602e" stroke-width="2"/><line x1="552" y1="580" x2="552" y2="603" stroke="#ce602e" stroke-width="2"/><line x1="692" y1="580" x2="692" y2="603" stroke="#ce602e" stroke-width="2"/><text x="205" y="395.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400" fill="#173d39" text-anchor="start">Hombro liso: se conserva completo</text><line x1="560" y1="670" x2="560" y2="605" stroke="#ce602e" stroke-width="4" marker-end="url(#arrow)"/><text x="70" y="715.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="400" fill="#173d39" text-anchor="start">Medí desde el final del hombro hasta la punta.</text><text x="70" y="765.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#173d39" text-anchor="start">Arandelas superiores nominales:</text><text x="70" y="805.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173d39" text-anchor="start">Corto fijo: 0,5 + 0,3  /  Corto móvil: 0,3 + 0,3 + 0,2 mm</text><text x="70" y="845.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="400" fill="#173d39" text-anchor="start">Largo: 0,5 + 0,5 + 0,5 + 0,3 mm. Juego final: 0,1–0,3 mm.</text><rect x="50" y="884" width="1100" height="65" rx="10" fill="#e4f1ec" stroke="none" stroke-width="2"/><text x="75" y="923.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="700" fill="#173d39" text-anchor="start">Punta retraída ≥0,5 mm en las uniones. Medí y quitá toda rebaba fuera del riel.</text><text x="50" y="978.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#526b73" text-anchor="start">Piezas impresas: geometría STL real. Herrajes y flechas: esquema de montaje, sin escala.</text></svg>