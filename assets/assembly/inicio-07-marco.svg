<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img"><title>El marco debe quedar así antes de apretar</title><desc>Cuatro escuadras interiores visibles y cuatro tuercas reservadas para los travesaños.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#cf5b27"/></marker></defs><rect width="1200" height="760" fill="#faf8f2"/><text x="40" y="50.0" font-family="DejaVu Sans,Arial" font-size="32" fill="#173d39" font-weight="700" text-anchor="start">El marco debe quedar así antes de apretar</text><text x="40" y="89.0" font-family="DejaVu Sans,Arial" font-size="21" fill="#173d39" font-weight="400" text-anchor="start">Cuatro escuadras interiores visibles y cuatro tuercas reservadas para los travesaños.</text><line x1="40" y1="110" x2="1160" y2="110" stroke="#d0ddd6" stroke-width="1"/><rect x="170" y="170" width="55" height="440" rx="0" fill="#d6dfdf" stroke="#173d39" stroke-width="2"/><rect x="575" y="170" width="55" height="440" rx="0" fill="#d6dfdf" stroke="#173d39" stroke-width="2"/><rect x="225" y="170" width="350" height="55" rx="0" fill="#d6dfdf" stroke="#173d39" stroke-width="2"/><rect x="225" y="555" width="350" height="55" rx="0" fill="#d6dfdf" stroke="#173d39" stroke-width="2"/><polygon points="225,225 283,225 225,283" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><polygon points="575,225 517,225 575,283" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><polygon points="225,555 283,555 225,497" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><polygon points="575,555 517,555 575,497" fill="#cf5b27" stroke="#173d39" stroke-width="2"/><rect x="195.0" y="345.0" width="20" height="20" rx="0" fill="#087f79" stroke="#173d39" stroke-width="2"/><circle cx="205" cy="355" r="3.8" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><rect x="195.0" y="435.0" width="20" height="20" rx="0" fill="#087f79" stroke="#173d39" stroke-width="2"/><circle cx="205" cy="445" r="3.8" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><rect x="585.0" y="345.0" width="20" height="20" rx="0" fill="#087f79" stroke="#173d39" stroke-width="2"/><circle cx="595" cy="355" r="3.8" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><rect x="585.0" y="435.0" width="20" height="20" rx="0" fill="#087f79" stroke="#173d39" stroke-width="2"/><circle cx="595" cy="445" r="3.8" fill="#faf8f2" stroke="#173d39" stroke-width="2"/><line x1="170" y1="170" x2="630" y2="610" stroke="#087f79" stroke-width="3" stroke-dasharray="7 6"/><line x1="630" y1="170" x2="170" y2="610" stroke="#cf5b27" stroke-width="3" stroke-dasharray="7 6"/><text x="400" y="151.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="700" text-anchor="middle">FONDO · motores después</text><text x="400" y="656.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="700" text-anchor="middle">FRENTE</text><text x="745" y="222.0" font-family="DejaVu Sans,Arial" font-size="27" fill="#cf5b27" font-weight="700" text-anchor="start">4 ESCUADRAS</text><text x="745" y="265.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">Una en cada esquina.</text><text x="745" y="293.6" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">Dos tornillos por escuadra.</text><text x="745" y="377.0" font-family="DejaVu Sans,Arial" font-size="27" fill="#087f79" font-weight="700" text-anchor="start">4 TUERCAS LIBRES</text><text x="745" y="420.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">Dos por costado.</text><text x="745" y="448.6" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">Se usan para la cama.</text><text x="745" y="532.0" font-family="DejaVu Sans,Arial" font-size="23" fill="#173d39" font-weight="700" text-anchor="start">DIAGONALES IGUALES</text><text x="745" y="571.0" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">Medí antes y después</text><text x="745" y="599.6" font-family="DejaVu Sans,Arial" font-size="22" fill="#173d39" font-weight="400" text-anchor="start">del apriete.</text><rect x="40" y="684" width="1120" height="48" rx="6" fill="#e4f1ec" stroke="none" stroke-width="2"/><text x="58" y="715.0" font-family="DejaVu Sans,Arial" font-size="23" fill="#173d39" font-weight="700" text-anchor="start">Las escuadras están en la mitad inferior: arriba queda sitio para el movimiento.</text><text x="40" y="752.0" font-family="DejaVu Sans,Arial" font-size="14" fill="#526b73" font-weight="400" text-anchor="start">Herrajes esquemáticos · no usar como plantilla de perforación · FT412 / edición 3</text></svg>