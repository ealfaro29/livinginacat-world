[platformio]
src_dir = Grbl_Esp32
lib_dir = libraries
extra_configs = ini/mks_dlc32.ini
[env:entity_ts24]
extends = env:mks_dlc32_v2_1_CoreXY
board_build.partitions = huge_app.csv
lib_deps = teemuatlut/TMCStepper@0.7.3
build_flags = ${esp32_common.build_flags}
    -DMACHINE_TYPE_COREXY
    -DDEFAULT_LANGUAGE_STATUS=1
    -DDEFAULT_BEEP_STATUS=0
    -DPROBE_PIN=GPIO_NUM_22
